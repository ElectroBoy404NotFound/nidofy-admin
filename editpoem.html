<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Edit Poem - Nidofy Admin Panel</title>
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nb-impl></nb-impl>
        <div id="layoutSidenav">
            <sb-impl></sb-impl>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">Edit Poem</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item"><a href="index.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Modify Poems</li>
                            <li class="breadcrumb-item active">Edit Poem</li>
                        </ol>
                        <div class="card mb-4">
                            <div class="card-body">
                                <form onsubmit="onUploadPoemSubmit(event)" id="uploadpoemform">
                                    <div class="mb-3">
                                        <label for="poemid" class="form-label">Poem ID</label>
                                        <input type="text" class="form-control" id="poemid" readonly>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="poemtitle" class="form-label">Poem Title</label>
                                        <input type="text" class="form-control" id="poemtitle" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="poemcontent" class="form-label">Poem Content</label>
                                        <textarea class="form-control" id="poemcontent" rows="10" required></textarea>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="poemsignaturelength" class="form-label">Signature Length</label>
                                            <input type="number" class="form-control" id="poemsignaturelength" required>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label for="poemsignature" class="form-label">Signature</label>
                                            <input type="text" class="form-control" id="poemsignature" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="poemdate" class="form-label">Date</label>
                                        <input type="text" class="form-control" id="poemdate" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary" id="editbtn">Update Poem</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </main>
                <footer-impl></footer-impl>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js" crossorigin="anonymous"></script>
        <script src="js/api.js"></script>
        <script src="js/components.js"></script>
        <script src="js/common.js"></script>
        <script src="js/editpoem.js"></script>
    </body>
</html>
